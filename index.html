<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia y Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { max-width: 550px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container my-5 d-flex justify-content-center">
    <div class="form-container w-100">
        <h2 class="text-center mb-4 text-primary">Control de Trabajo Diario</h2>
        
        <form id="attendanceForm" class="needs-validation" novalidate>
            
            <div class="mb-3">
                <label for="empleado" class="form-label">Nombre del Colaborador:</label>
                <input type="text" class="form-control" id="empleado" required minlength="3" placeholder="Ej. Juan Pérez">
                <div class="invalid-feedback">Por favor, ingresa el nombre (mínimo 3 caracteres).</div>
            </div>

            <div class="mb-3">
                <label for="asistencia" class="form-label">Estado de Asistencia:</label>
                <select class="form-select" id="asistencia" required>
                    <option value="" selected disabled>Selecciona una opción...</option>
                    <option value="Presente">Presente</option>
                    <option value="Tardanza">Tardanza</option>
                    <option value="Justificado">Justificado</option>
                </select>
                <div class="invalid-feedback">Por favor, selecciona el estado de asistencia.</div>
            </div>

            <div class="mb-3">
                <label for="tarea" class="form-label">Descripción de la Tarea Realizada:</label>
                <textarea class="form-control" id="tarea" rows="3" required placeholder="Describe brevemente las actividades del día..."></textarea>
                <div class="invalid-feedback">Por favor, detalla la tarea realizada.</div>
            </div>

            <div class="mb-3">
                <label for="horas" class="form-label">Horas Invertidas:</label>
                <input type="number" class="form-control" id="horas" min="0.5" max="24" step="0.5" required placeholder="Ej. 8">
                <div class="invalid-feedback">Ingresa un rango de horas válido (0.5 a 24).</div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Registrar Jornada</button>
        </form>

        <div id="responseMessage" class="mt-3 alert d-none" role="alert"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxoVGEoTagvtnLporSKdnacrTA-qrDkMJ-RXV4sfGM9lRUQn3llqZLcN_XcHWCidrcV6w/exec";

    document.getElementById('attendanceForm').addEventListener('submit', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const form = event.target;
        const msgDiv = document.getElementById('responseMessage');
        const btn = document.getElementById('submitBtn');

        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        form.classList.add('was-validated');
        btn.disabled = true;
        btn.innerText = "Enviando datos...";
        msgDiv.classList.add('d-none');

        const formData = {
            empleado: document.getElementById('empleado').value,
            asistencia: document.getElementById('asistencia').value,
            tarea: document.getElementById('tarea').value,
            horas: document.getElementById('horas').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            msgDiv.className = "mt-3 alert alert-success";
            msgDiv.innerText = "¡Registro guardado con éxito en Google Sheets!";
            msgDiv.classList.remove('d-none');
            
            form.reset();
            form.classList.remove('was-validated');
        })
        .catch(error => {
            msgDiv.className = "mt-3 alert alert-danger";
            msgDiv.innerText = "Hubo un error al enviar el registro. Inténtalo de nuevo.";
            msgDiv.classList.remove('d-none');
            console.error('Error:', error);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Registrar Jornada";
        });
    });
</script>

</body>
</html>
