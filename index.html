<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: var(--bs-body-bg);
            transition: background-color 0.3s ease;
        }
        .form-container {
            max-width: 500px;
            background: var(--bs-surface-color, var(--bs-body-mix, #212529));
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background-color: #3b82f6; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 2rem;
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
        }
        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-outline-secondary btn-sm" id="themeToggler" type="button">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>
</div>

<div class="container my-4 d-flex justify-content-center align-items-center min-vh-100">
    <div class="form-container w-100">
        
        <div class="logo-placeholder" id="appLogo">
            <i class="bi bi-truck"></i> 
        </div>

        <h3 class="text-center mb-1 font-weight-bold">Registro de Jornada</h3>
        <p class="text-muted text-center small mb-4">Control de Asistencia y Actividades</p>
        
        <form id="attendanceForm" class="needs-validation" novalidate>
            
            <div class="mb-3">
                <label for="dni" class="form-label">Número de DNI:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control" id="dni" pattern="\d{8}" inputmode="numeric" maxlength="8" required placeholder="Ingresa tus 8 dígitos">
                    <div class="invalid-feedback">El DNI debe tener exactamente 8 números.</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="sucursal" class="form-label">Sucursal / Punto de Control:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                    <select class="form-select" id="sucursal" required>
                        <option value="" selected disabled>Selecciona tu sede...</option>
                        <option value="Sede Lima">Sede Lima</option>
                        <option value="Sede Trujillo">Sede Trujillo</option>
                        <option value="Sede Piura">Sede Piura</option>
                    </select>
                    <div class="invalid-feedback">Por favor, selecciona la sucursal actual.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Tipo de Registro:</label>
                <div class="row g-2">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_registro" id="inicio" value="Inicio de Labores" required>
                        <label class="btn btn-outline-success w-100 py-3" for="inicio">
                            <i class="bi bi-play-circle d-block fs-4 mb-1"></i>
                            Inicio Labores
                        </label>
                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_registro" id="termino" value="Termino de Labores" required>
                        <label class="btn btn-outline-danger w-100 py-3" for="termino">
                            <i class="bi bi-stop-circle d-block fs-4 mb-1"></i>
                            Término Labores
                        </label>
                    </div>
                </div>
                <div class="text-danger small mt-1 d-none" id="radio-error">Debes seleccionar el tipo de registro.</div>
            </div>

            <div class="mb-4">
                <label for="tarea" class="form-label">Comentarios / Tarea del Turno (Opcional):</label>
                <textarea class="form-control" id="tarea" rows="2" placeholder="Ej: Despacho de unidades, incidentes en ruta..."></textarea>
            </div>

            <input type="hidden" id="latitud" value="0">
            <input type="hidden" id="longitud" value="0">

            <button type="submit" class="btn btn-primary w-100 py-2 fs-5" id="submitBtn">Enviar Registro</button>
        </form>

        <div id="responseMessage" class="mt-3 alert d-none" role="alert"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxoVGEoTagvtnLporSKdnacrTA-qrDkMJ-RXV4sfGM9lRUQn3llqZLcN_XcHWCidrcV6w/exec";

    // Función reutilizable para capturar coordenadas
    function capturarCoordenadas() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('latitud').value = position.coords.latitude;
                    document.getElementById('longitud').value = position.coords.longitude;
                },
                (error) => {
                    console.warn("Geolocalización denegada o no disponible: ", error.message);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    }

    window.addEventListener('load', capturarCoordenadas);

    // --- CONMUTADOR DE MODO OSCURO / CLARO ---
    const toggler = document.getElementById('themeToggler');
    const themeIcon = document.getElementById('themeIcon');
    toggler.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'light');
            themeIcon.className = "bi bi-moon-fill";
            document.querySelector('.form-container').style.background = "#ffffff";
        } else {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
            themeIcon.className = "bi bi-sun-fill";
            document.querySelector('.form-container').style.background = "";
        }
    });

    // --- PROCESAMIENTO DEL FORMULARIO ---
    document.getElementById('attendanceForm').addEventListener('submit', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const form = event.target;
        const msgDiv = document.getElementById('responseMessage');
        const btn = document.getElementById('submitBtn');
        const radioError = document.getElementById('radio-error');

        const tipoRegistroChecked = document.querySelector('input[name="tipo_registro"]:checked');
        if (!tipoRegistroChecked) {
            radioError.classList.remove('d-none');
            form.classList.add('was-validated');
            return;
        } else {
            radioError.classList.add('d-none');
        }

        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        form.classList.add('was-validated');
        btn.disabled = true;
        btn.innerText = "Registrando marcación...";
        msgDiv.classList.add('d-none');

        const formData = {
            dni: document.getElementById('dni').value,
            sucursal: document.getElementById('sucursal').value,
            tipo_registro: tipoRegistroChecked.value,
            tarea: document.getElementById('tarea').value,
            latitud: document.getElementById('latitud').value,
            longitud: document.getElementById('longitud').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            msgDiv.className = "mt-3 alert alert-success text-center";
            msgDiv.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i> ¡Marcación de ${formData.tipo_registro} guardada con éxito!`;
            msgDiv.classList.remove('d-none');
            
            // Reestablecer formulario limpiando también los estilos de validación visual de Bootstrap
            form.reset();
            form.classList.remove('was-validated');
            
            // Volver a pedir coordenadas para la siguiente marcación limpia
            capturarCoordenadas();
        })
        .catch(error => {
            msgDiv.className = "mt-3 alert alert-danger text-center";
            msgDiv.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i> Error de conexión. Reintente.`;
            msgDiv.classList.remove('d-none');
            console.error('Error:', error);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Enviar Registro";
        });
    });
</script>

</body>
</html>
