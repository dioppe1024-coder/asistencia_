<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-slate-50 text-slate-800 min-vh-100 flex items-center justify-center p-4 relative min-h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl border-[1px] border-slate-200/80 shadow-md shadow-slate-200/50">
        
        <div id="appLogo" class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mx-auto mb-5 border border-slate-200 shadow-sm shadow-slate-200/80 overflow-hidden">
            <img src="./magsatransparente--.jpg" alt="Logo" width="40" height="40" class="rounded-xl object-cover"> 
        </div>

        <h3 class="text-center text-2xl font-bold tracking-tight mb-1">Registro de Jornada</h3>
        <p class="text-slate-400 text-center text-sm mb-6">Control de Asistencia Automático</p>
        
        <form id="attendanceForm" class="space-y-4" novalidate>
            
            <div>
                <label for="dni" class="block text-sm font-medium mb-1.5">Número de DNI:</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                        <i class="bi bi-card-text"></i>
                    </div>
                    <input type="text" id="dni" pattern="\d{8}" inputmode="numeric" maxlength="8" required 
                        placeholder="Ingresa tus 8 dígitos" 
                        class="block w-full ps-10 pe-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                </div>
                <div id="dniLoading" class="text-xs text-blue-500 mt-1 hidden"><i class="bi bi-hourglass-split animate-spin"></i> Buscando colaborador...</div>
                <div id="dniError" class="text-xs text-red-500 mt-1 hidden">El DNI debe tener exactamente 8 números.</div>
            </div>

            <div>
                <label for="colaborador" class="block text-sm font-medium mb-1.5">Nombre del Colaborador:</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                        <i class="bi bi-person"></i>
                    </div>
                    <input type="text" id="colaborador" readonly required 
                        placeholder="Se autocompletará con el DNI" 
                        class="block w-full ps-10 pe-3 py-2.5 bg-slate-100 text-slate-500 border border-slate-300 rounded-lg text-sm cursor-not-allowed outline-none">
                </div>
            </div>

            <div>
                <label for="sucursal" class="block text-sm font-medium mb-1.5">Sucursal asignada:</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                        <i class="bi bi-geo-alt"></i>
                    </div>
                    <input type="text" id="sucursal" readonly required 
                        placeholder="Se autocompletará con el DNI" 
                        class="block w-full ps-10 pe-3 py-2.5 bg-slate-100 text-slate-500 border border-slate-300 rounded-lg text-sm cursor-not-allowed outline-none">
                </div>
            </div>

            <div>
                <label for="puesto" class="block text-sm font-medium mb-1.5">Selecciona tu Puesto / Rol:</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                        <i class="bi bi-briefcase"></i>
                    </div>
                    <select id="puesto" required
                        class="block w-full ps-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm appearance-none cursor-pointer">
                        <option value="" disabled selected>Cargando puestos disponibles...</option>
                    </select>
                    <div class="absolute inset-y-0 end-0 flex items-center pe-3 pointer-events-none text-slate-400">
                        <i class="bi bi-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">Tipo de Registro:</label>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <input type="radio" name="tipo_registro" id="inicio" value="Ingreso" class="sr-only peer" required>
                        <label for="inicio" class="flex flex-col items-center justify-center p-3 border-2 border-emerald-600/50 text-emerald-600 rounded-xl cursor-pointer font-semibold uppercase text-sm tracking-wider transition-all peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 peer-checked:shadow-lg peer-checked:shadow-emerald-600/20 hover:bg-emerald-50">
                            <i class="bi bi-box-arrow-in-right text-2xl mb-1"></i>
                            Ingreso
                        </label>
                    </div>
                    <div>
                        <input type="radio" name="tipo_registro" id="termino" value="Salida" class="sr-only peer" required>
                        <label for="termino" class="flex flex-col items-center justify-center p-3 border-2 border-red-600/50 text-red-500 rounded-xl cursor-pointer font-semibold uppercase text-sm tracking-wider transition-all peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 peer-checked:shadow-lg peer-checked:shadow-red-600/20 hover:bg-red-50">
                            <i class="bi bi-box-arrow-left text-2xl mb-1"></i>
                            Salida
                        </label>
                    </div>
                </div>
                <div id="radioError" class="text-xs text-red-500 mt-2 hidden">Debes seleccionar Ingreso o Salida.</div>
            </div>

            <div>
                <label for="tarea" class="block text-sm font-medium mb-1.5">Comentarios / Observaciones (Opcional):</label>
                <textarea id="tarea" rows="2" placeholder="Ej: Unidad limpia, incidencias en almacén..." 
                    class="block w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"></textarea>
            </div>

            <input type="hidden" id="latitud" value="0">
            <input type="hidden" id="longitud" value="0">

            <button type="submit" id="submitBtn" disabled 
                class="w-full bg-yellow-400 hover:bg-amber-500 text-slate-900 font-semibold py-3 px-4 rounded-lg text-base transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-yellow-400 shadow-md shadow-yellow-500/10">
                Enviar Registro
            </button>
        </form>

        <div id="responseMessage" class="mt-4 p-3 rounded-lg text-center text-sm font-medium hidden" role="alert"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxoVGEoTagvtnLporSKdnacrTA-qrDkMJ-RXV4sfGM9lRUQn3llqZLcN_XcHWCidrcV6w/exec";

        // --- CARGAR PUESTOS DESDE GOOGLE SHEETS ---
        function cargarPuestos() {
            const selectPuesto = document.getElementById('puesto');
            fetch(`${WEB_APP_URL}?action=getPuestos`, { method: 'GET', redirect: 'follow' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        selectPuesto.innerHTML = '<option value="" disabled selected>-- Elige tu puesto operativo --</option>';
                        data.puestos.forEach(puesto => {
                            const option = document.createElement('option');
                            option.value = puesto;
                            option.textContent = puesto;
                            selectPuesto.appendChild(option);
                        });
                    } else {
                        selectPuesto.innerHTML = '<option value="" disabled>Error al cargar puestos</option>';
                    }
                })
                .catch(err => {
                    console.error("Error cargando puestos:", err);
                    selectPuesto.innerHTML = '<option value="" disabled>Error de conexión</option>';
                });
        }
        window.addEventListener('DOMContentLoaded', cargarPuestos);

        // --- BUSQUEDA DE DNI EN TIEMPO REAL ---
        document.getElementById('dni').addEventListener('input', function(e) {
            const dni = e.target.value;
            const loader = document.getElementById('dniLoading');
            const errorDni = document.getElementById('dniError');
            const inputNombre = document.getElementById('colaborador');
            const inputSucursal = document.getElementById('sucursal');
            const btnSubmit = document.getElementById('submitBtn');

            errorDni.classList.add('hidden');

            if (dni.length === 8 && /^\d+$/.test(dni)) {
                loader.classList.remove('hidden');
                
                fetch(`${WEB_APP_URL}?dni=${dni}`, { method: 'GET', redirect: 'follow' })
                    .then(response => response.json())
                    .then(data => {
                        loader.classList.add('hidden');
                        if (data.status === "success" && data.encontrado) {
                            inputNombre.value = data.nombre;
                            inputSucursal.value = data.sucursal;
                            btnSubmit.disabled = false;
                        } else {
                            inputNombre.value = "";
                            inputSucursal.value = "";
                            btnSubmit.disabled = true;
                            alert("⚠️ El DNI ingresado no está registrado en la Base de Datos.");
                        }
                    })
                    .catch(err => {
                        loader.classList.add('hidden');
                        console.error("Error al buscar DNI:", err);
                    });
            } else {
                inputNombre.value = "";
                inputSucursal.value = "";
                btnSubmit.disabled = true;
            }
        });

        // --- GEOLOCALIZACIÓN ---
        function capturarCoordenadas() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('latitud').value = position.coords.latitude;
                        document.getElementById('longitud').value = position.coords.longitude;
                    },
                    null,
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }
        window.addEventListener('load', capturarCoordenadas);

        // --- PROCESAMIENTO DEL ENVÍO ---
        document.getElementById('attendanceForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const form = event.target;
            const msgDiv = document.getElementById('responseMessage');
            const btn = document.getElementById('submitBtn');
            const radioError = document.getElementById('radioError');
            const errorDni = document.getElementById('dniError');
            const dniInput = document.getElementById('dni');

            if (dniInput.value.length !== 8) {
                errorDni.classList.remove('hidden');
                return;
            }

            const tipoRegistroChecked = document.querySelector('input[name="tipo_registro"]:checked');
            if (!tipoRegistroChecked) {
                radioError.classList.remove('hidden');
                return;
            } else {
                radioError.classList.add('hidden');
            }

            btn.disabled = true;
            btn.innerText = "Registrando...";

            const formData = {
                dni: dniInput.value,
                colaborador: document.getElementById('colaborador').value,
                sucursal: document.getElementById('sucursal').value,
                puesto: document.getElementById('puesto').value,
                tipo_registro: tipoRegistroChecked.value,
                tarea: document.getElementById('tarea').value,
                latitud: document.getElementById('latitud').value,
                longitud: document.getElementById('longitud').value
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                msgDiv.className = "mt-4 p-3 rounded-lg text-center text-sm font-medium bg-emerald-100 text-emerald-800";
                msgDiv.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i> ¡${formData.tipo_registro} registrado con éxito!`;
                msgDiv.classList.remove('hidden');
                
                form.reset();
                btn.disabled = true; 
                btn.innerText = "Enviar Registro";
                
                capturarCoordenadas();
                document.getElementById('puesto').selectedIndex = 0;
            })
            .catch(error => {
                msgDiv.className = "mt-4 p-3 rounded-lg text-center text-sm font-medium bg-red-100 text-red-800";
                msgDiv.innerText = "Error de conexión. Intente de nuevo.";
                msgDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Enviar Registro";
            });
        });
    </script>
</body>
</html>
