<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia Logística</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: var(--bs-body-bg); transition: background-color 0.3s ease; }
        .form-container {
            max-width: 600px; background: var(--bs-surface-color, var(--bs-body-mix, #212529));
            padding: 30px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .logo-placeholder {
            width: 80px; height: 80px; background-color: #fdcb04; border-radius: 12%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;
            font-size: 2rem; color: white; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
        }
        .btn-check + .btn-outline-success {
            border: 2px solid #198754; color: #198754; font-weight: 600; background: transparent;
        }
        .btn-check:checked + .btn-outline-success {
            background-color: #198754 !important; color: white !important; box-shadow: 0 4px 15px rgba(25, 135, 84, 0.4);
        }
        .btn-check + .btn-outline-danger {
            border: 2px solid #dc3545; color: #dc3545; font-weight: 600; background: transparent;
        }
        .btn-check:checked + .btn-outline-danger {
            background-color: #dc3545 !important; color: white !important; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
    </style>
</head>
<body>

<div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-outline-secondary btn-sm" id="themeToggler" type="button">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>
</div>

<div class="container my-4 d-flex justify-content-center align-items-center min-vh-100">
    <div class="form-container w-100">
        
        <div class="logo-placeholder" id="appLogo">
            <i class="bi bi-truck"></i> 
        </div>

        <h3 class="text-center mb-1 font-weight-bold">Registro de Jornada</h3>
        <p class="text-muted text-center small mb-4">Control de Asistencia Automático</p>
        
        <form id="attendanceForm" class="needs-validation" novalidate>
            
            <div class="mb-3">
                <label for="dni" class="form-label">Número de DNI:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control" id="dni" pattern="\d{8}" inputmode="numeric" maxlength="8" required placeholder="Ingresa tus 8 dígitos">
                    <div class="invalid-feedback">El DNI debe tener exactamente 8 números.</div>
                </div>
                <div id="dniLoading" class="form-text text-info d-none"><i class="bi bi-hourglass-split"></i> Buscando colaborador...</div>
            </div>

            <div class="mb-3">
                <label for="colaborador" class="form-label">Nombre del Colaborador:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="colaborador" readonly required placeholder="Se autocompletará con el DNI">
                </div>
            </div>

            <div class="mb-3">
                <label for="sucursal" class="form-label">Sucursal asignada:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                    <input type="text" class="form-control" id="sucursal" readonly required placeholder="Se autocompletará con el DNI">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Tipo de Registro:</label>
                <div class="row g-3">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_registro" id="inicio" value="Ingreso" required>
                        <label class="btn btn-outline-success w-100 py-3 text-uppercase" for="inicio">
                            <i class="bi bi-box-arrow-in-right d-block fs-3 mb-1"></i>
                            Ingreso
                        </label>
                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_registro" id="termino" value="Salida" required>
                        <label class="btn btn-outline-danger w-100 py-3 text-uppercase" for="termino">
                            <i class="bi bi-box-arrow-left d-block fs-3 mb-1"></i>
                            Salida
                        </label>
                    </div>
                </div>
                <div class="text-danger small mt-2 d-none" id="radio-error">Debes seleccionar Ingreso o Salida.</div>
            </div>

            <div class="mb-4">
                <label for="tarea" class="form-label">Comentarios / Observaciones (Opcional):</label>
                <textarea class="form-control" id="tarea" rows="2" placeholder="Ej: Unidad limpia, incidencias en almacén..."></textarea>
            </div>

            <input type="hidden" id="latitud" value="0">
            <input type="hidden" id="longitud" value="0">

            <button type="submit" class="btn btn-primary w-100 py-2 fs-5" id="submitBtn" disabled>Enviar Registro</button>
        </form>

        <div id="responseMessage" class="mt-3 alert d-none" role="alert"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxoVGEoTagvtnLporSKdnacrTA-qrDkMJ-RXV4sfGM9lRUQn3llqZLcN_XcHWCidrcV6w/exec";

    // --- OPTIMIZACIÓN: BUSQUEDA CON CONTROL DE REDIRECCIÓN ---
    document.getElementById('dni').addEventListener('input', function(e) {
        const dni = e.target.value;
        const loader = document.getElementById('dniLoading');
        const inputNombre = document.getElementById('colaborador');
        const inputSucursal = document.getElementById('sucursal');
        const btnSubmit = document.getElementById('submitBtn');

        if (dni.length === 8 && /^\d+$/.test(dni)) {
            loader.classList.remove('d-none');
            
            // Requerir de forma explícita seguir redirecciones para evitar bloqueos móviles
            fetch(`${WEB_APP_URL}?dni=${dni}`, { method: 'GET', redirect: 'follow' })
                .then(response => response.json())
                .then(data => {
                    loader.classList.add('d-none');
                    if (data.status === "success" && data.encontrado) {
                        inputNombre.value = data.nombre;
                        inputSucursal.value = data.sucursal;
                        btnSubmit.disabled = false;
                    } else {
                        inputNombre.value = "";
                        inputSucursal.value = "";
                        alert("⚠️ El DNI ingresado no está registrado en la Base de Datos.");
                        btnSubmit.disabled = true;
                    }
                })
                .catch(err => {
                    loader.classList.add('d-none');
                    console.error("Error al buscar DNI:", err);
                });
        } else {
            inputNombre.value = "";
            inputSucursal.value = "";
            btnSubmit.disabled = true;
        }
    });

    // --- GEOLOCALIZACIÓN ---
    function capturarCoordenadas() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('latitud').value = position.coords.latitude;
                    document.getElementById('longitud').value = position.coords.longitude;
                },
                null,
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    }
    window.addEventListener('load', capturarCoordenadas);

    // --- MODO OSCURO / CLARO ---
    const toggler = document.getElementById('themeToggler');
    const themeIcon = document.getElementById('themeIcon');
    toggler.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-bs-theme');
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'light');
            themeIcon.className = "bi bi-moon-fill";
            document.querySelector('.form-container').style.background = "#ffffff";
        } else {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
            themeIcon.className = "bi bi-sun-fill";
            document.querySelector('.form-container').style.background = "";
        }
    });

    // --- PROCESAMIENTO DEL ENVÍO ---
    document.getElementById('attendanceForm').addEventListener('submit', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const form = event.target;
        const msgDiv = document.getElementById('responseMessage');
        const btn = document.getElementById('submitBtn');
        const radioError = document.getElementById('radio-error');

        const tipoRegistroChecked = document.querySelector('input[name="tipo_registro"]:checked');
        if (!tipoRegistroChecked) {
            radioError.classList.remove('d-none');
            return;
        } else {
            radioError.classList.add('d-none');
        }

        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        btn.disabled = true;
        btn.innerText = "Registrando...";

        const formData = {
            dni: document.getElementById('dni').value,
            colaborador: document.getElementById('colaborador').value,
            sucursal: document.getElementById('sucursal').value,
            tipo_registro: tipoRegistroChecked.value,
            tarea: document.getElementById('tarea').value,
            latitud: document.getElementById('latitud').value,
            longitud: document.getElementById('longitud').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            msgDiv.className = "mt-3 alert alert-success text-center";
            msgDiv.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i> ¡${formData.tipo_registro} registrado con éxito!`;
            msgDiv.classList.remove('d-none');
            
            form.reset();
            form.classList.remove('was-validated');
            btn.disabled = true;
            btn.innerText = "Enviar Registro";
            capturarCoordenadas();
        })
        .catch(error => {
            msgDiv.className = "mt-3 alert alert-danger text-center";
            msgDiv.innerText = "Error de conexión. Intente de nuevo.";
            msgDiv.classList.remove('d-none');
            btn.disabled = false;
            btn.innerText = "Enviar Registro";
        });
    });
</script>

</body>
</html>
